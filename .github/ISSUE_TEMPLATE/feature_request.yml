name: 💡 Connector / Feature Request
description: Propose a new AI client connector, script enhancement, or template improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new connector (e.g. Cursor, Ollama, LibreChat) or a better vault template layout? Let us know!

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New AI Client Connector (e.g. Cursor, Ollama, Open-WebUI)
        - Setup Script Improvement (PowerShell / Bash)
        - Vault Template / PARA Structure Enhancement
        - Documentation / Guide Improvement
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific problem or workflow bottleneck?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Implementation
      description: Describe your proposed connector, script logic, or template addition.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
